<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Styles CSS animés embarqués pour autonomie de l'image -->
    <style>
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .spin-cw {
        transform-origin: 0px 0px;
        animation: spin-cw 25s linear infinite;
      }
      .spin-ccw {
        transform-origin: 0px 0px;
        animation: spin-ccw 20s linear infinite;
      }
      .pulse-core {
        transform-origin: 0px 0px;
        animation: pulse 2.5s ease-in-out infinite;
      }
    </style>

    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="glow-cargo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="portal-gradient-5ce8c9" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ce8c9" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#5ce8c9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5ce8c9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(3.4)" filter="url(#glow-cargo)" stroke-width="0.47" stroke-linecap="round" stroke-linejoin="round">
    
      <!-- Module de propulsion industriel lourd -->
      <path d="M -8 3 L -12 4 L -12 -4 L -8 -3 Z" fill="#0f2e29" stroke="#5ce8c9" stroke-linejoin="round" />
      <polygon points="-12,2 -16,0 -12,-2" fill="#ffaa44" opacity="0.7"/>
      <!-- Poutre centrale structurelle -->
      <line x1="-8" y1="0" x2="10" y2="0" stroke="#5ce8c9" stroke-width="1.5" />
      <!-- Râtelier de conteneurs de ressources -->
      <rect x="-6" y="-5" width="4" height="10" fill="rgba(255, 180, 84, 0.2)" stroke="#5ce8c9" stroke-width="0.8" />
      <rect x="-1" y="-5" width="4" height="10" fill="rgba(255, 180, 84, 0.2)" stroke="#5ce8c9" stroke-width="0.8" />
      <rect x="4" y="-5" width="4" height="10" fill="rgba(255, 180, 84, 0.2)" stroke="#5ce8c9" stroke-width="0.8" />
      <!-- Fixations et renforts -->
      <line x1="-6" y1="-3" x2="-2" y2="-3" stroke="#5ce8c9" stroke-width="0.5" opacity="0.5" />
      <line x1="-1" y1="-3" x2="3" y2="-3" stroke="#5ce8c9" stroke-width="0.5" opacity="0.5" />
      <line x1="4" y1="-3" x2="8" y2="-3" stroke="#5ce8c9" stroke-width="0.5" opacity="0.5" />
      <!-- Cabine de pilotage tracteur -->
      <path d="M 10 2 L 14 0 L 10 -2 Z" fill="#0f2e29" stroke="#5ce8c9" stroke-linejoin="round" />
      <circle cx="11" cy="0" r="0.8" fill="#5ce8c9" opacity="0.8" />
    
  </g>
</svg>