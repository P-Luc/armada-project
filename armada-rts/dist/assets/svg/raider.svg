<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Styles CSS animés embarqués pour autonomie de l'image -->
    <style>
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .spin-cw {
        transform-origin: 0px 0px;
        animation: spin-cw 25s linear infinite;
      }
      .spin-ccw {
        transform-origin: 0px 0px;
        animation: spin-ccw 20s linear infinite;
      }
      .pulse-core {
        transform-origin: 0px 0px;
        animation: pulse 2.5s ease-in-out infinite;
      }
    </style>

    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="glow-raider" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="portal-gradient-ff4254" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4254" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ff4254" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff4254" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(4.5)" filter="url(#glow-raider)" stroke-width="0.36" stroke-linecap="round" stroke-linejoin="round">
    
      <!-- Réacteurs latéraux -->
      <polygon points="-4,6 -8,5 -4,4" fill="#ff4254" opacity="0.8" />
      <polygon points="-4,-6 -8,-5 -4,-4" fill="#ff4254" opacity="0.8" />
      <!-- Propulseur principal -->
      <polygon points="-1,2 -7,0 -1,-2" fill="#ff4254" opacity="0.9" />
      <!-- Fuselage central blindé -->
      <path d="M 12 0 L 2 3 L -4 8 L -1 0 L -4 -8 L 2 -3 Z" fill="#2e0c10" stroke="#ff4254" stroke-linejoin="round" />
      <!-- Jonctions des ailes -->
      <line x1="2" y1="3" x2="-2" y2="6" stroke="#ff4254" stroke-width="1.5" />
      <line x1="2" y1="-3" x2="-2" y2="-6" stroke="#ff4254" stroke-width="1.5" />
      <!-- Doubles canons laser frontaux parallèles -->
      <line x1="6" y1="-1.5" x2="14" y2="-1.5" stroke="#ff4254" stroke-width="1.2" />
      <line x1="6" y1="1.5" x2="14" y2="1.5" stroke="#ff4254" stroke-width="1.2" />
      <!-- Œil optique central (signature AI) -->
      <circle cx="4" cy="0" r="1" fill="#ff4254" opacity="0.9" />
    
  </g>
</svg>