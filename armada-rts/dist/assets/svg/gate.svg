<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Styles CSS animés embarqués pour autonomie de l'image -->
    <style>
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .spin-cw {
        transform-origin: 0px 0px;
        animation: spin-cw 25s linear infinite;
      }
      .spin-ccw {
        transform-origin: 0px 0px;
        animation: spin-ccw 20s linear infinite;
      }
      .pulse-core {
        transform-origin: 0px 0px;
        animation: pulse 2.5s ease-in-out infinite;
      }
    </style>

    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="glow-gate" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="portal-gradient-ff4254" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4254" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ff4254" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff4254" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(1.2)" filter="url(#glow-gate)" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round">
    
        <!-- Concentric rings swirling representing gravity waves -->
        <circle cx="0" cy="0" r="24" stroke="#ff4254" stroke-width="0.6" stroke-dasharray="2 6" fill="none" class="spin-cw" style="animation-duration: 8s; opacity: 0.6;" />
        <circle cx="0" cy="0" r="18" stroke="#ff4254" stroke-width="0.8" stroke-dasharray="4 4" fill="none" class="spin-ccw" style="animation-duration: 6s; opacity: 0.5;" />

        <!-- 4 Arcs structurels porteurs massifs -->
        <g class="spin-cw">
          <circle cx="0" cy="0" r="30" stroke="#ff4254" stroke-width="3.2" fill="none" stroke-dasharray="35 12" />
        </g>
        
        <!-- Étoile structurelle interne de couplage magnétique -->
        <path d="M 0 -30 L 0 30 M -30 0 L 30 0" stroke="#ff4254" stroke-width="0.8" opacity="0.4" class="spin-cw"/>
        
        <!-- 8 Bobines d'induction de singularité -->
        <g class="spin-cw">
          <circle cx="30.00" cy="0.00" r="2.5" fill="#2e0c10" stroke="#ff4254" stroke-width="1.0" /><circle cx="21.21" cy="21.21" r="2.5" fill="#2e0c10" stroke="#ff4254" stroke-width="1.0" /><circle cx="0.00" cy="30.00" r="2.5" fill="#2e0c10" stroke="#ff4254" stroke-width="1.0" /><circle cx="-21.21" cy="21.21" r="2.5" fill="#2e0c10" stroke="#ff4254" stroke-width="1.0" /><circle cx="-30.00" cy="0.00" r="2.5" fill="#2e0c10" stroke="#ff4254" stroke-width="1.0" /><circle cx="-21.21" cy="-21.21" r="2.5" fill="#2e0c10" stroke="#ff4254" stroke-width="1.0" /><circle cx="-0.00" cy="-30.00" r="2.5" fill="#2e0c10" stroke="#ff4254" stroke-width="1.0" /><circle cx="21.21" cy="-21.21" r="2.5" fill="#2e0c10" stroke="#ff4254" stroke-width="1.0" />
        </g>

        <!-- Cœur de singularité gravitationnelle / portail énergétique -->
        <circle cx="0" cy="0" r="16" fill="url(#portal-gradient-ff4254)" class="pulse-core" />
      
  </g>
</svg>