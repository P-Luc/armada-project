<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Styles CSS animés embarqués pour autonomie de l'image -->
    <style>
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .spin-cw {
        transform-origin: 0px 0px;
        animation: spin-cw 25s linear infinite;
      }
      .spin-ccw {
        transform-origin: 0px 0px;
        animation: spin-ccw 20s linear infinite;
      }
      .pulse-core {
        transform-origin: 0px 0px;
        animation: pulse 2.5s ease-in-out infinite;
      }
    </style>

    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="glow-vhangar" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="portal-gradient-5ce8c9" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ce8c9" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#5ce8c9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5ce8c9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(3.8)" filter="url(#glow-vhangar)" stroke-width="0.42" stroke-linecap="round" stroke-linejoin="round">
    
      <!-- Coque principale porte-aéronefs -->
      <path d="M 14 0 L 8 6 L -8 6 L -12 2 L -12 -2 L -8 -6 L 8 -6 Z" fill="#0f2e29" stroke="#5ce8c9" stroke-linejoin="round" />
      <!-- Pont d'envol centralisé -->
      <line x1="-2" y1="-6" x2="-2" y2="6" stroke="#5ce8c9" stroke-width="0.8" opacity="0.5" stroke-dasharray="2 2" />
      <rect x="0" y="-3" width="8" height="6" fill="rgba(92,232,201,0.15)" stroke="#5ce8c9" stroke-width="0.8" />
      <!-- Piste de lancement lumineuse -->
      <line x1="0" y1="0" x2="10" y2="0" stroke="#5ce8c9" stroke-width="0.6" stroke-dasharray="1 1" opacity="0.8" />
      <!-- Tour de contrôle déportée (tribord) -->
      <path d="M 4 6 L 6 9 L 0 9 L -2 6 Z" fill="#0f2e29" stroke="#5ce8c9" stroke-linejoin="round" />
      <!-- Antennes de communication de flotte -->
      <line x1="2" y1="9" x2="2" y2="12" stroke="#5ce8c9" stroke-width="0.8" />
      <circle cx="2" cy="12" r="0.5" fill="#5ce8c9" />
      <!-- Batteries de moteurs arrières (x4) -->
      <polygon points="-12,4 -16,4.5 -12,5" fill="#ffb454" opacity="0.8" />
      <polygon points="-12,1 -16,1.5 -12,2" fill="#ffb454" opacity="0.8" />
      <polygon points="-12,-4 -16,-4.5 -12,-5" fill="#ffb454" opacity="0.8" />
      <polygon points="-12,-1 -16,-1.5 -12,-2" fill="#ffb454" opacity="0.8" />
    
  </g>
</svg>