<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Styles CSS animés embarqués pour autonomie de l'image -->
    <style>
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .spin-cw {
        transform-origin: 0px 0px;
        animation: spin-cw 25s linear infinite;
      }
      .spin-ccw {
        transform-origin: 0px 0px;
        animation: spin-ccw 20s linear infinite;
      }
      .pulse-core {
        transform-origin: 0px 0px;
        animation: pulse 2.5s ease-in-out infinite;
      }
    </style>

    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="glow-spatiale" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="portal-gradient-5ce8c9" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ce8c9" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#5ce8c9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5ce8c9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(1.2)" filter="url(#glow-spatiale)" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round">
    
        <!-- Grand anneau d'habitat rotatif (8 côtés) -->
        <g class="spin-cw">
          <polygon points="28.00,0.00 19.80,19.80 0.00,28.00 -19.80,19.80 -28.00,0.00 -19.80,-19.80 -0.00,-28.00 19.80,-19.80" fill="#0f2e29" stroke="#5ce8c9" stroke-width="1.6" stroke-linejoin="round"/>
          <circle cx="0" cy="0" r="23" stroke="#5ce8c9" stroke-width="0.8" fill="none" opacity="0.4" />
          <!-- Hublots / Fenêtres de l'habitat -->
          <circle cx="-16" cy="-16" r="1.0" fill="#fff" opacity="0.8"/>
          <circle cx="16" cy="-16" r="1.0" fill="#fff" opacity="0.8"/>
          <circle cx="-16" cy="16" r="1.0" fill="#fff" opacity="0.8"/>
          <circle cx="16" cy="16" r="1.0" fill="#fff" opacity="0.8"/>
          <circle cx="-22" cy="0" r="1.0" fill="#fff" opacity="0.8"/>
          <circle cx="22" cy="0" r="1.0" fill="#fff" opacity="0.8"/>
        </g>
        
        <!-- 4 Pylônes structurels fixes avec balises lumineuses -->
        <line x1="0" y1="-14" x2="0" y2="-40" stroke="#5ce8c9" stroke-width="1.8" />
        <line x1="0" y1="14" x2="0" y2="40" stroke="#5ce8c9" stroke-width="1.8" />
        <line x1="-14" y1="0" x2="-40" y2="0" stroke="#5ce8c9" stroke-width="1.8" />
        <line x1="14" y1="0" x2="40" y2="0" stroke="#5ce8c9" stroke-width="1.8" />
        
        <!-- 4 Réflecteurs / Panneaux radiateurs thermiques -->
        <line x1="-12" y1="-12" x2="-28" y2="-28" stroke="#5ce8c9" stroke-width="2.5" opacity="0.75" />
        <line x1="12" y1="-12" x2="28" y2="-28" stroke="#5ce8c9" stroke-width="2.5" opacity="0.75" />
        <line x1="-12" y1="12" x2="-28" y2="28" stroke="#5ce8c9" stroke-width="2.5" opacity="0.75" />
        <line x1="12" y1="12" x2="28" y2="28" stroke="#5ce8c9" stroke-width="2.5" opacity="0.75" />

        <!-- Noyau central lourd blindé -->
        <circle cx="0" cy="0" r="13" fill="#0f2e29" stroke="#5ce8c9" stroke-width="1.6"/>
        <!-- Pastilles de niveau -->
        <circle cx="-7" cy="0" r="2.5" fill="#5ce8c9"/>
        <circle cx="0" cy="0" r="2.5" fill="#5ce8c9"/>
        <circle cx="7" cy="0" r="2.5" fill="#ffb454" class="pulse-core"/>
        
        <!-- Grille extérieure de guidage des vaisseaux en chantier -->
        <circle cx="0" cy="0" r="46" stroke="#5ce8c9" stroke-width="1.2" fill="none" stroke-dasharray="6 6" opacity="0.6" class="spin-cw" style="animation-duration:35s;"/>
      
  </g>
</svg>