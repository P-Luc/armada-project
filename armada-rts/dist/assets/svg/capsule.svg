<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Styles CSS animés embarqués pour autonomie de l'image -->
    <style>
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .spin-cw {
        transform-origin: 0px 0px;
        animation: spin-cw 25s linear infinite;
      }
      .spin-ccw {
        transform-origin: 0px 0px;
        animation: spin-ccw 20s linear infinite;
      }
      .pulse-core {
        transform-origin: 0px 0px;
        animation: pulse 2.5s ease-in-out infinite;
      }
    </style>

    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="glow-capsule" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="portal-gradient-8dffa8" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8dffa8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#8dffa8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8dffa8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(6)" filter="url(#glow-capsule)" stroke-width="0.27" stroke-linecap="round" stroke-linejoin="round">
    
      <!-- Coque hexagonale étanche -->
      <path d="M 5 0 L 2.5 4.3 L -2.5 4.3 L -5 0 L -2.5 -4.3 L 2.5 -4.3 Z" fill="#142e1a" stroke="#8dffa8" stroke-linejoin="round" />
      <!-- Bobines de stockage électromagnétique -->
      <line x1="-2.5" y1="2.5" x2="2.5" y2="2.5" stroke="#8dffa8" stroke-width="0.6" opacity="0.6" />
      <line x1="-2.5" y1="-2.5" x2="2.5" y2="-2.5" stroke="#8dffa8" stroke-width="0.6" opacity="0.6" />
      <!-- Réacteur à plasma vert central pulsant -->
      <circle cx="0" cy="0" r="2.6" fill="#8dffa8" class="pulse-core" />
    
  </g>
</svg>