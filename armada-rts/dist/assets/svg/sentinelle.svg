<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Styles CSS animés embarqués pour autonomie de l'image -->
    <style>
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .spin-cw {
        transform-origin: 0px 0px;
        animation: spin-cw 25s linear infinite;
      }
      .spin-ccw {
        transform-origin: 0px 0px;
        animation: spin-ccw 20s linear infinite;
      }
      .pulse-core {
        transform-origin: 0px 0px;
        animation: pulse 2.5s ease-in-out infinite;
      }
    </style>

    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="glow-sentinelle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="portal-gradient-5ce8c9" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ce8c9" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#5ce8c9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5ce8c9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(2.2)" filter="url(#glow-sentinelle)" stroke-width="0.73" stroke-linecap="round" stroke-linejoin="round">
    
      <!-- Base de fondation carrée avec treillis métallique -->
      <rect x="-13" y="-13" width="26" height="26" fill="#0f2e29" stroke="#5ce8c9" stroke-linejoin="round"/>
      <line x1="-13" y1="-13" x2="13" y2="13" stroke="#5ce8c9" stroke-width="0.6" opacity="0.3" />
      <line x1="-13" y1="13" x2="13" y2="-13" stroke="#5ce8c9" stroke-width="0.6" opacity="0.3" />
      
      <!-- Pylônes d'ancrage aux 4 coins -->
      <circle cx="-13" cy="-13" r="1.5" fill="#5ce8c9" />
      <circle cx="13" cy="-13" r="1.5" fill="#5ce8c9" />
      <circle cx="-13" cy="13" r="1.5" fill="#5ce8c9" />
      <circle cx="13" cy="13" r="1.5" fill="#5ce8c9" />

      <!-- Chemin de roulement circulaire de la tourelle -->
      <circle cx="0" cy="0" r="9" fill="none" stroke="#5ce8c9" stroke-width="1.0" opacity="0.8" />
      
      <!-- Double canon lourd -->
      <g transform="rotate(35)">
        <rect x="-3.5" y="-5" width="8" height="10" fill="#0f2e29" stroke="#5ce8c9" stroke-width="0.8" />
        <line x1="0" y1="-2.2" x2="26" y2="-2.2" stroke="#5ce8c9" stroke-width="2.2" stroke-linecap="square" />
        <line x1="0" y1="2.2" x2="26" y2="2.2" stroke="#5ce8c9" stroke-width="2.2" stroke-linecap="square" />
        <!-- Répartiteur de recul hydraulique -->
        <rect x="22" y="-3.5" width="2" height="7" fill="#5ce8c9" />
      </g>
      
      <!-- Générateur à fusion central -->
      <circle cx="0" cy="0" r="4.5" fill="#5ce8c9" />
    
  </g>
</svg>