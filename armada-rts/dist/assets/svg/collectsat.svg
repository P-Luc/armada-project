<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Styles CSS animés embarqués pour autonomie de l'image -->
    <style>
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .spin-cw {
        transform-origin: 0px 0px;
        animation: spin-cw 25s linear infinite;
      }
      .spin-ccw {
        transform-origin: 0px 0px;
        animation: spin-ccw 20s linear infinite;
      }
      .pulse-core {
        transform-origin: 0px 0px;
        animation: pulse 2.5s ease-in-out infinite;
      }
    </style>

    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="glow-collectsat" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="portal-gradient-5ce8c9" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ce8c9" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#5ce8c9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5ce8c9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(2.2)" filter="url(#glow-collectsat)" stroke-width="0.73" stroke-linecap="round" stroke-linejoin="round">
    
      <!-- Grilles de panneaux photovoltaïques étendues transversales -->
      <g class="spin-cw">
        <line x1="-28" y1="0" x2="28" y2="0" stroke="#8dffa8" stroke-width="2.2" />
        <!-- Panneau solaire gauche -->
        <rect x="-26" y="-5.5" width="10" height="11" fill="#0f2e29" stroke="#8dffa8" stroke-width="0.8" />
        <line x1="-21" y1="-5.5" x2="-21" y2="5.5" stroke="#8dffa8" stroke-width="0.6" />
        <!-- Panneau solaire droit -->
        <rect x="16" y="-5.5" width="10" height="11" fill="#0f2e29" stroke="#8dffa8" stroke-width="0.8" />
        <line x1="21" y1="-5.5" x2="21" y2="5.5" stroke="#8dffa8" stroke-width="0.6" />
        
        <!-- Noyau en losange rotatif -->
        <path d="M 13 0 L 0 13 L -13 0 L 0 -13 Z" fill="#0f2e29" stroke="#5ce8c9" stroke-linejoin="round" />
      </g>
      
      <!-- Focalisateur de captation énergétique pulsant -->
      <circle cx="0" cy="0" r="7.5" fill="#8dffa8" class="pulse-core" opacity="0.65" />
      
      <!-- Anneaux d'induction de charge externe -->
      <circle cx="0" cy="0" r="19" stroke="#8dffa8" stroke-width="1.0" fill="none" stroke-dasharray="12 4" opacity="0.75"/>
      <circle cx="0" cy="0" r="21" stroke="#8dffa8" stroke-width="0.5" fill="none" stroke-dasharray="2 10" opacity="0.4"/>
    
  </g>
</svg>