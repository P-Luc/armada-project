<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="glow-h_nuee" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="portal-gradient-c77dff" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c77dff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#c77dff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c77dff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(4.8)" filter="url(#glow-h_nuee)" stroke-width="0.33" stroke-linecap="round" stroke-linejoin="round">
    
          <!-- Sillages -->
          <polygon points="-4,0.7 -9,0 -4,-0.7" fill="#c77dff" opacity="0.9" />
          <!-- Dard central -->
          <path d="M 9 0 L 0 5 L -4.5 2 L -1.5 0 L -4.5 -2 L 0 -5 Z" fill="#221030" stroke="#c77dff" stroke-width="1.1" stroke-linejoin="round" />
          <!-- Deux dards satellites solidaires (les Traqueurs d'origine) -->
          <path d="M 4 6.5 L -1 8.5 L -3 6.5 L -1 5.5 Z" fill="#221030" stroke="#c77dff" stroke-width="0.8" stroke-linejoin="round" />
          <path d="M 4 -6.5 L -1 -8.5 L -3 -6.5 L -1 -5.5 Z" fill="#221030" stroke="#c77dff" stroke-width="0.8" stroke-linejoin="round" />
          <!-- Filaments de cohésion -->
          <line x1="1" y1="3.5" x2="0" y2="6.5" stroke="#c77dff" stroke-width="0.6" opacity="0.8" />
          <line x1="1" y1="-3.5" x2="0" y2="-6.5" stroke="#c77dff" stroke-width="0.6" opacity="0.8" />
          <circle cx="2" cy="0" r="1.5" fill="#c77dff" class="pulse-core" />
        
  </g>
</svg>