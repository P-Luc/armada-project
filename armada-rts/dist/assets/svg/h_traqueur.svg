<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Styles CSS animés embarqués pour autonomie de l'image -->
    <style>
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .spin-cw {
        transform-origin: 0px 0px;
        animation: spin-cw 25s linear infinite;
      }
      .spin-ccw {
        transform-origin: 0px 0px;
        animation: spin-ccw 20s linear infinite;
      }
      .pulse-core {
        transform-origin: 0px 0px;
        animation: pulse 2.5s ease-in-out infinite;
      }
    </style>

    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="glow-h_traqueur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="portal-gradient-c77dff" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c77dff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#c77dff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c77dff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(5.5)" filter="url(#glow-h_traqueur)" stroke-width="0.29" stroke-linecap="round" stroke-linejoin="round">
    
      <!-- Moteurs à impulsion rapide -->
      <polygon points="-4,2.5 -9,1.5 -4,0.5" fill="#c77dff" opacity="0.8" />
      <polygon points="-4,-2.5 -9,-1.5 -4,-0.5" fill="#c77dff" opacity="0.8" />
      <!-- Fuselage ultra-fin -->
      <path d="M 10 0 L -6 4 L -3 0 L -6 -4 Z" fill="#221030" stroke="#c77dff" stroke-linejoin="round" />
      <!-- Lignes de flux d'énergie -->
      <line x1="-2" y1="0" x2="4" y2="0" stroke="#8dffa8" stroke-width="1" />
    
  </g>
</svg>