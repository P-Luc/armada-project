<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Styles CSS animés embarqués pour autonomie de l'image -->
    <style>
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .spin-cw {
        transform-origin: 0px 0px;
        animation: spin-cw 25s linear infinite;
      }
      .spin-ccw {
        transform-origin: 0px 0px;
        animation: spin-ccw 20s linear infinite;
      }
      .pulse-core {
        transform-origin: 0px 0px;
        animation: pulse 2.5s ease-in-out infinite;
      }
    </style>

    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="glow-h_bastion" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="portal-gradient-c77dff" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c77dff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#c77dff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c77dff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(3.5)" filter="url(#glow-h_bastion)" stroke-width="0.46" stroke-linecap="round" stroke-linejoin="round">
    
        <!-- Bouclier énergétique périphérique -->
        <polygon points="14.00,0.00 7.00,12.12 -7.00,12.12 -14.00,0.00 -7.00,-12.12 7.00,-12.12" fill="none" stroke="#8dffa8" stroke-width="0.5" stroke-dasharray="4 2" opacity="0.6" />
        <!-- Rempart principal hexagonal -->
        <polygon points="14.00,0.00 7.00,12.12 -7.00,12.12 -14.00,0.00 -7.00,-12.12 7.00,-12.12" fill="#221030" stroke="#c77dff" stroke-width="1.5" stroke-linejoin="round" />
        <polygon points="8.00,0.00 4.00,6.93 -4.00,6.93 -8.00,0.00 -4.00,-6.93 4.00,-6.93" fill="none" stroke="#c77dff" stroke-width="0.8" />
        
        <!-- Plateformes d'artillerie aux sommets -->
        <circle cx="14" cy="0" r="2" fill="#c77dff" />
        <line x1="14" y1="0" x2="18" y2="0" stroke="#c77dff" stroke-width="1.2" />
        
        <circle cx="-7" cy="12.1" r="2" fill="#c77dff" />
        <line x1="-7" y1="12.1" x2="-9" y2="15.5" stroke="#c77dff" stroke-width="1.2" />
        
        <circle cx="-7" cy="-12.1" r="2" fill="#c77dff" />
        <line x1="-7" y1="-12.1" x2="-9" y2="-15.5" stroke="#c77dff" stroke-width="1.2" />
        
        <!-- Hub d'énergie et processeur central -->
        <circle cx="0" cy="0" r="4" fill="none" stroke="#c77dff" stroke-width="1.2" />
        <rect x="-1.5" y="-1.5" width="3" height="3" fill="#8dffa8" class="pulse-core" />
        
        <!-- Canalisations d'énergie vers les remparts -->
        <line x1="0" y1="-4" x2="0" y2="-14" stroke="#c77dff" stroke-width="0.8" opacity="0.6" />
        <line x1="-3.5" y1="2" x2="-12" y2="7" stroke="#c77dff" stroke-width="0.8" opacity="0.6" />
        <line x1="3.5" y1="2" x2="12" y2="7" stroke="#c77dff" stroke-width="0.8" opacity="0.6" />
      
  </g>
</svg>