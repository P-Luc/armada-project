<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Styles CSS animés embarqués pour autonomie de l'image -->
    <style>
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .spin-cw {
        transform-origin: 0px 0px;
        animation: spin-cw 25s linear infinite;
      }
      .spin-ccw {
        transform-origin: 0px 0px;
        animation: spin-ccw 20s linear infinite;
      }
      .pulse-core {
        transform-origin: 0px 0px;
        animation: pulse 2.5s ease-in-out infinite;
      }
    </style>

    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="glow-aiturret" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="portal-gradient-ff4254" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4254" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ff4254" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff4254" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(2.2)" filter="url(#glow-aiturret)" stroke-width="0.73" stroke-linecap="round" stroke-linejoin="round">
    
      <!-- Base de protection carrée lourde -->
      <rect x="-13" y="-13" width="26" height="26" fill="#2e0c10" stroke="#ff4254" stroke-linejoin="round"/>
      <line x1="-13" y1="0" x2="13" y2="0" stroke="#ff4254" stroke-width="0.8" opacity="0.3" />
      <line x1="0" y1="-13" x2="0" y2="13" stroke="#ff4254" stroke-width="0.8" opacity="0.3" />
      
      <!-- Plaques d'armures latérales de flanc -->
      <path d="M -13,0 L -18,-5 L -18,5 Z" fill="#2e0c10" stroke="#ff4254" stroke-width="0.8" />
      <path d="M 13,0 L 18,-5 L 18,5 Z" fill="#2e0c10" stroke="#ff4254" stroke-width="0.8" />

      <!-- Canon lourd double directionnel (fictif 115 deg) -->
      <g transform="rotate(115)">
        <rect x="-4.5" y="-5" width="9" height="10" fill="#2e0c10" stroke="#ff4254" stroke-width="0.8" />
        <line x1="0" y1="-2.2" x2="26" y2="-2.2" stroke="#ff4254" stroke-width="2.5" />
        <line x1="0" y1="2.2" x2="26" y2="2.2" stroke="#ff4254" stroke-width="2.5" />
        <!-- Manchons de refroidissement des canons -->
        <line x1="8" y1="-4" x2="16" y2="-4" stroke="#ff4254" stroke-width="0.8" />
        <line x1="8" y1="4" x2="16" y2="4" stroke="#ff4254" stroke-width="0.8" />
      </g>
      
      <!-- Cœur de focalisation de particules -->
      <circle cx="0" cy="0" r="5" fill="#ff4254" />
    
  </g>
</svg>