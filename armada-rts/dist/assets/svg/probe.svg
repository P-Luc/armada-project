<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Styles CSS animés embarqués pour autonomie de l'image -->
    <style>
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .spin-cw {
        transform-origin: 0px 0px;
        animation: spin-cw 25s linear infinite;
      }
      .spin-ccw {
        transform-origin: 0px 0px;
        animation: spin-ccw 20s linear infinite;
      }
      .pulse-core {
        transform-origin: 0px 0px;
        animation: pulse 2.5s ease-in-out infinite;
      }
    </style>

    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="glow-probe" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="portal-gradient-8dffa8" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8dffa8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#8dffa8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8dffa8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(5.5)" filter="url(#glow-probe)" stroke-width="0.29" stroke-linecap="round" stroke-linejoin="round">
    
      <!-- Fuselage aérodynamique -->
      <path d="M 7 0 L -2 3.5 L -5 1.5 L -5 -1.5 L -2 -3.5 Z" fill="#142e1a" stroke="#8dffa8" stroke-linejoin="round" />
      <!-- Parabole de repérage et de guidage frontale -->
      <path d="M 7,0 A 3.5,3.5 0 0,1 7,6" fill="none" stroke="#8dffa8" stroke-width="1.0" transform="translate(1,-3)" />
      <!-- Trains d'atterrissage repliés sur les flancs -->
      <line x1="-2" y1="3.5" x2="-5" y2="6.5" stroke="#8dffa8" stroke-width="0.8" />
      <line x1="-2" y1="-3.5" x2="-5" y2="-6.5" stroke="#8dffa8" stroke-width="0.8" />
      <!-- Noyau d'énergie de matérialisation -->
      <circle cx="-2" cy="0" r="1.5" fill="#ffb454" />
    
  </g>
</svg>