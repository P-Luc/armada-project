<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="glow-h_matrice" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="portal-gradient-c77dff" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c77dff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#c77dff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c77dff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(2.9)" filter="url(#glow-h_matrice)" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round">
    
          <!-- Champ de réparation projeté -->
          <circle cx="0" cy="0" r="19" fill="none" stroke="#c77dff" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.55" class="spin-cw" />
          <!-- Coque à douze faces (Synapse + Entrepôt soudés) -->
          <path d="M 15.00 0.00 L 9.09 5.25 L 7.50 12.99 L 0.00 10.50 L -7.50 12.99 L -9.09 5.25 L -15.00 0.00 L -9.09 -5.25 L -7.50 -12.99 L -0.00 -10.50 L 7.50 -12.99 L 9.09 -5.25  Z" fill="#221030" stroke="#c77dff" stroke-width="1.3" stroke-linejoin="round" />
          <!-- Nervures de transfert -->
          <line x1="-15" y1="0" x2="15" y2="0" stroke="#c77dff" stroke-width="0.7" opacity="0.7" />
          <line x1="0" y1="-15" x2="0" y2="15" stroke="#c77dff" stroke-width="0.7" opacity="0.7" />
          <!-- Cuve de stockage centrale -->
          <rect x="-5" y="-5" width="10" height="10" fill="#221030" stroke="#c77dff" stroke-width="1.1" transform="rotate(45)" />
          <circle cx="0" cy="0" r="2.6" fill="#c77dff" class="pulse-core" />
        
  </g>
</svg>