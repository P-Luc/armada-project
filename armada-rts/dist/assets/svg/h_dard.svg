<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="glow-h_dard" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="portal-gradient-c77dff" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c77dff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#c77dff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c77dff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(3)" filter="url(#glow-h_dard)" stroke-width="0.53" stroke-linecap="round" stroke-linejoin="round">
    
          <!-- Poussée arrière -->
          <polygon points="-10,2 -16,0 -10,-2" fill="#c77dff" opacity="0.85" />
          <!-- Fer de lance allongé -->
          <path d="M 20 0 L 2 3.5 L -6 6 L -10 2 L -10 -2 L -6 -6 L 2 -3.5 Z" fill="#221030" stroke="#c77dff" stroke-width="1.3" stroke-linejoin="round" />
          <!-- Rails d'accélération jumelés (les deux Épines) -->
          <line x1="4" y1="1.6" x2="18" y2="0.7" stroke="#c77dff" stroke-width="0.8" opacity="0.85" />
          <line x1="4" y1="-1.6" x2="18" y2="-0.7" stroke="#c77dff" stroke-width="0.8" opacity="0.85" />
          <!-- Ailerons stabilisateurs -->
          <line x1="-6" y1="6" x2="-11" y2="10" stroke="#c77dff" stroke-width="1" />
          <line x1="-6" y1="-6" x2="-11" y2="-10" stroke="#c77dff" stroke-width="1" />
          <!-- Chambre de charge -->
          <circle cx="-2" cy="0" r="2.6" fill="#c77dff" class="pulse-core" />
        
  </g>
</svg>