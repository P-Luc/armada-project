<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Styles CSS animés embarqués pour autonomie de l'image -->
    <style>
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .spin-cw {
        transform-origin: 0px 0px;
        animation: spin-cw 25s linear infinite;
      }
      .spin-ccw {
        transform-origin: 0px 0px;
        animation: spin-ccw 20s linear infinite;
      }
      .pulse-core {
        transform-origin: 0px 0px;
        animation: pulse 2.5s ease-in-out infinite;
      }
    </style>

    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="glow-h_essaim" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="portal-gradient-c77dff" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c77dff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#c77dff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c77dff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(5)" filter="url(#glow-h_essaim)" stroke-width="0.32" stroke-linecap="round" stroke-linejoin="round">
    
      <!-- Antenne de liaison neuronale -->
      <path d="M -3 0 L -8 2 M -3 0 L -8 -2" fill="none" stroke="#c77dff" stroke-width="0.8" />
      <!-- Coque principale asymétrique et cybernétique -->
      <path d="M 9 0 L -1 5 L -4 2 L -2 0 L -4 -2 L -1 -5 Z" fill="#221030" stroke="#c77dff" stroke-linejoin="round" />
      <!-- Sous-modules greffés -->
      <polygon points="1,2 3,4 0,3" fill="none" stroke="#c77dff" stroke-width="0.6" />
      <polygon points="1,-2 3,-4 0,-3" fill="none" stroke="#c77dff" stroke-width="0.6" />
      <!-- Réseau de circuits -->
      <line x1="2" y1="0" x2="-2" y2="0" stroke="#c77dff" stroke-width="0.8" opacity="0.7" />
      <!-- Noyaux de calcul distribués -->
      <circle cx="3" cy="0" r="1.5" fill="none" stroke="#c77dff" stroke-width="0.8" />
      <circle cx="3" cy="0" r="0.5" fill="#8dffa8" />
      <rect x="-3" y="-1" width="2" height="2" fill="none" stroke="#c77dff" stroke-width="0.8" />
    
  </g>
</svg>