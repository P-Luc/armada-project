<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Styles CSS animés embarqués pour autonomie de l'image -->
    <style>
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .spin-cw {
        transform-origin: 0px 0px;
        animation: spin-cw 25s linear infinite;
      }
      .spin-ccw {
        transform-origin: 0px 0px;
        animation: spin-ccw 20s linear infinite;
      }
      .pulse-core {
        transform-origin: 0px 0px;
        animation: pulse 2.5s ease-in-out infinite;
      }
    </style>

    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="glow-corvette" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="portal-gradient-5ce8c9" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ce8c9" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#5ce8c9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5ce8c9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(4.5)" filter="url(#glow-corvette)" stroke-width="0.36" stroke-linecap="round" stroke-linejoin="round">
    
      <!-- Fuselage lourd -->
      <path d="M 12 0 L 6 3 L -4 4 L -6 0 L -4 -4 L 6 -3 Z" fill="#0f2e29" stroke="#5ce8c9" stroke-linejoin="round" />
      <!-- Nacelles de moteurs latérales -->
      <path d="M -2 4 L -4 7 L -7 7 L -5 4 Z" fill="#0f2e29" stroke="#5ce8c9" stroke-linejoin="round" />
      <path d="M -2 -4 L -4 -7 L -7 -7 L -5 -4 Z" fill="#0f2e29" stroke="#5ce8c9" stroke-linejoin="round" />
      <!-- Jets de plasma des nacelles -->
      <polygon points="-7,6 -10,5.5 -7,5" fill="#ffaa44" opacity="0.8"/>
      <polygon points="-7,-6 -10,-5.5 -7,-5" fill="#ffaa44" opacity="0.8"/>
      <!-- Propulseur central -->
      <polygon points="-6,2 -11,0 -6,-2" fill="#ffaa44" opacity="0.9"/>
      <!-- Pont de commandement -->
      <polygon points="2,1.5 5,0 2,-1.5" fill="none" stroke="#5ce8c9" opacity="0.6" stroke-width="0.8" />
      <!-- Canons de flanc -->
      <line x1="-1" y1="4" x2="5" y2="4" stroke="#5ce8c9" stroke-width="1.2" />
      <line x1="-1" y1="-4" x2="5" y2="-4" stroke="#5ce8c9" stroke-width="1.2" />
    
  </g>
</svg>