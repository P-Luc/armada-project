<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Styles CSS animés embarqués pour autonomie de l'image -->
    <style>
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .spin-cw {
        transform-origin: 0px 0px;
        animation: spin-cw 25s linear infinite;
      }
      .spin-ccw {
        transform-origin: 0px 0px;
        animation: spin-ccw 20s linear infinite;
      }
      .pulse-core {
        transform-origin: 0px 0px;
        animation: pulse 2.5s ease-in-out infinite;
      }
    </style>

    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="glow-drone" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="portal-gradient-ff4254" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4254" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ff4254" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff4254" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(5.2)" filter="url(#glow-drone)" stroke-width="0.31" stroke-linecap="round" stroke-linejoin="round">
    
      <!-- Noyau de poussée cybernétique -->
      <polygon points="-3,0.8 -7,0 -3,-0.8" fill="#ff4254" opacity="0.85" />
      <!-- Coque géométrique losangique -->
      <path d="M 7 0 L 0 5 L -7 0 L 0 -5 Z" fill="#2e0c10" stroke="#ff4254" stroke-linejoin="round" />
      <!-- Capteurs optiques jumeaux -->
      <circle cx="2" cy="-1.5" r="0.8" fill="#ff4254" />
      <circle cx="2" cy="1.5" r="0.8" fill="#ff4254" />
      <!-- Ailes stabilisatrices pointues -->
      <line x1="0" y1="5" x2="-4" y2="9.5" stroke="#ff4254" stroke-width="1.0" />
      <line x1="0" y1="-5" x2="-4" y2="-9.5" stroke="#ff4254" stroke-width="1.0" />
    
  </g>
</svg>