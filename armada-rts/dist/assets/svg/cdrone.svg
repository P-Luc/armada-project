<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Styles CSS animés embarqués pour autonomie de l'image -->
    <style>
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .spin-cw {
        transform-origin: 0px 0px;
        animation: spin-cw 25s linear infinite;
      }
      .spin-ccw {
        transform-origin: 0px 0px;
        animation: spin-ccw 20s linear infinite;
      }
      .pulse-core {
        transform-origin: 0px 0px;
        animation: pulse 2.5s ease-in-out infinite;
      }
    </style>

    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="glow-cdrone" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="portal-gradient-5ce8c9" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ce8c9" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#5ce8c9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5ce8c9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(5.2)" filter="url(#glow-cdrone)" stroke-width="0.31" stroke-linecap="round" stroke-linejoin="round">
    
      <!-- Fuselage central -->
      <path d="M 8 0 L -2 2 L -4 0 L -2 -2 Z" fill="#0f2e29" stroke="#5ce8c9" stroke-linejoin="round" />
      <!-- Ailes en flèche inversée -->
      <path d="M 0 1.5 L -3 5 L -5 5 L -2 1.5 Z" fill="#0f2e29" stroke="#5ce8c9" stroke-linejoin="round" />
      <path d="M 0 -1.5 L -3 -5 L -5 -5 L -2 -1.5 Z" fill="#0f2e29" stroke="#5ce8c9" stroke-linejoin="round" />
      <!-- Canons sur les ailes -->
      <line x1="-3" y1="5" x2="3" y2="5" stroke="#5ce8c9" stroke-width="0.8" opacity="0.8" />
      <line x1="-3" y1="-5" x2="3" y2="-5" stroke="#5ce8c9" stroke-width="0.8" opacity="0.8" />
      <!-- Cockpit/Capteur vitré -->
      <polygon points="4,1 6,0 4,-1" fill="#5ce8c9" opacity="0.7" />
      <!-- Propulseur principal -->
      <polygon points="-4,1.5 -8,0 -4,-1.5" fill="#ffb454" opacity="0.85"/>
    
  </g>
</svg>