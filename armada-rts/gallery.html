<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ÉVEIL MACHINE — Kit d'assets SVG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #04070c;
    --panel-bg: rgba(10, 20, 32, 0.65);
    --border-color: rgba(92, 232, 201, 0.2);
    --text-color: #d1f4ff;
    --text-muted: #7fa8b5;
    
    /* Factions default colors */
    --color-player: #5ce8c9;
    --color-ai: #ff4254;
    --color-hive: #c77dff;
    --color-neutral: #8dffa8;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-dark);
    color: var(--text-color);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    background-image: 
      radial-gradient(circle at 20% 30%, rgba(20, 70, 66, 0.25) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(90, 18, 28, 0.2) 0%, transparent 45%),
      linear-gradient(rgba(18, 30, 49, 0.2) 1px, transparent 1px),
      linear-gradient(90deg, rgba(18, 30, 49, 0.2) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
  }

  header {
    background: rgba(4, 7, 12, 0.85);
    border-bottom: 1px solid var(--border-color);
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Michroma', sans-serif;
    font-size: 1.5rem;
    letter-spacing: 2px;
    color: var(--color-player);
    text-shadow: 0 0 10px rgba(92, 232, 201, 0.5);
  }

  .logo span {
    color: var(--text-color);
    font-style: italic;
    opacity: 0.6;
    margin: 0 5px;
  }

  .subtitle {
    font-size: 0.9rem;
    color: var(--text-muted);
    margin-top: 4px;
    letter-spacing: 1px;
  }

  .nav-links {
    display: flex;
    gap: 20px;
  }

  .btn-game {
    border: 1px solid var(--color-player);
    background: rgba(92, 232, 201, 0.1);
    color: var(--color-player);
    padding: 8px 16px;
    text-decoration: none;
    font-size: 0.9rem;
    border-radius: 4px;
    transition: all 0.3s ease;
    cursor: pointer;
  }

  .btn-game:hover {
    background: var(--color-player);
    color: var(--bg-dark);
    box-shadow: 0 0 15px var(--color-player);
  }

  .main-layout {
    display: flex;
    flex: 1;
    padding: 30px 40px;
    gap: 30px;
    max-width: 1800px;
    width: 100%;
    margin: 0 auto;
  }

  /* Sidebar controls */
  .sidebar {
    width: 320px;
    flex-shrink: 0;
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 24px;
    height: fit-content;
    position: sticky;
    top: 100px;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  .sidebar h2 {
    font-family: 'Michroma', sans-serif;
    font-size: 1.1rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 12px;
    margin-bottom: 20px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .control-group {
    margin-bottom: 22px;
  }

  .control-group label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .faction-presets {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .preset-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: #fff;
    padding: 8px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.85rem;
    transition: all 0.2s ease;
  }

  .preset-btn:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.3);
  }

  .preset-btn.active[data-preset="player"] { border-color: var(--color-player); color: var(--color-player); background: rgba(92, 232, 201, 0.08); }
  .preset-btn.active[data-preset="ai"] { border-color: var(--color-ai); color: var(--color-ai); background: rgba(255, 66, 84, 0.08); }
  .preset-btn.active[data-preset="hive"] { border-color: var(--color-hive); color: var(--color-hive); background: rgba(199, 125, 255, 0.08); }
  .preset-btn.active[data-preset="neutral"] { border-color: var(--color-neutral); color: var(--color-neutral); background: rgba(141, 255, 168, 0.08); }

  .color-picker-wrapper {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .color-picker-wrapper div {
    flex: 1;
  }

  .color-input-container {
    position: relative;
    display: flex;
    align-items: center;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.3);
    border-radius: 4px;
    padding: 4px;
  }

  input[type="color"] {
    -webkit-appearance: none;
    border: none;
    width: 28px;
    height: 24px;
    border-radius: 3px;
    cursor: pointer;
    background: none;
  }

  input[type="color"]::-webkit-color-swatch-wrapper {
    padding: 0;
  }

  input[type="color"]::-webkit-color-swatch {
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 3px;
  }

  .color-hex {
    font-size: 0.85rem;
    margin-left: 8px;
    text-transform: uppercase;
    width: 100%;
    border: none;
    background: transparent;
    color: #fff;
    font-family: inherit;
    outline: none;
  }

  .slider-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    background: rgba(255,255,255,0.1);
    height: 4px;
    border-radius: 2px;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--color-player);
    cursor: pointer;
    box-shadow: 0 0 8px var(--color-player);
    transition: all 0.15s ease;
  }

  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }

  .slider-val {
    width: 35px;
    text-align: right;
    font-size: 0.9rem;
    color: var(--text-color);
  }

  .toggle-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }

  .switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 22px;
  }

  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .slider-switch {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: rgba(255,255,255,0.15);
    transition: .3s;
    border-radius: 22px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .slider-switch:before {
    position: absolute;
    content: "";
    height: 14px;
    width: 14px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: .3s;
    border-radius: 50%;
  }

  input:checked + .slider-switch {
    background-color: rgba(92, 232, 201, 0.3);
    border-color: var(--color-player);
  }

  input:checked + .slider-switch:before {
    transform: translateX(22px);
    background-color: var(--color-player);
    box-shadow: 0 0 8px var(--color-player);
  }

  /* Right content area */
  .content-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* Filter bar */
  .filter-bar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px 20px;
    backdrop-filter: blur(12px);
  }

  .filter-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
    padding: 6px 14px;
    font-family: inherit;
    font-size: 0.9rem;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .filter-btn:hover {
    color: #fff;
    background: rgba(255,255,255,0.05);
  }

  .filter-btn.active {
    border-color: var(--color-player);
    color: var(--color-player);
    background: rgba(92, 232, 201, 0.08);
    text-shadow: 0 0 5px rgba(92, 232, 201, 0.3);
  }

  /* Grid layout */
  .assets-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
  }

  .asset-card {
    background: var(--panel-bg);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    backdrop-filter: blur(8px);
  }

  .asset-card:hover {
    transform: translateY(-5px);
    border-color: var(--border-highlight, var(--color-player));
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.6), 0 0 15px rgba(92, 232, 201, 0.05);
  }

  .asset-preview {
    height: 180px;
    background: rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding: 20px;
  }

  .asset-preview svg {
    max-width: 100%;
    max-height: 100%;
    transition: transform 0.4s ease;
  }

  .asset-card:hover .asset-preview svg {
    transform: scale(1.1);
  }

  .asset-info {
    padding: 18px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .asset-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .asset-title {
    font-family: 'Michroma', sans-serif;
    font-size: 0.95rem;
    color: #fff;
    letter-spacing: 0.5px;
  }

  .asset-id {
    font-size: 0.75rem;
    color: var(--text-muted);
    background: rgba(255,255,255,0.05);
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .asset-desc {
    font-size: 0.8rem;
    color: var(--text-muted);
    line-height: 1.4;
  }

  .asset-stats {
    font-size: 0.75rem;
    color: rgba(92, 232, 201, 0.75);
    background: rgba(92, 232, 201, 0.05);
    padding: 6px 10px;
    border-radius: 4px;
    margin-top: auto;
    border: 1px solid rgba(92, 232, 201, 0.1);
    display: flex;
    justify-content: space-between;
  }

  .asset-actions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    border-top: 1px solid rgba(255,255,255,0.05);
  }

  .action-btn {
    background: transparent;
    border: none;
    color: #fff;
    padding: 12px;
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .action-btn:first-child {
    border-right: 1px solid rgba(255,255,255,0.05);
  }

  .action-btn:hover {
    background: rgba(255,255,255,0.04);
    color: var(--color-player);
  }

  .action-btn.download:hover {
    color: var(--color-neutral);
  }

  /* Custom scrollbar */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-track {
    background: var(--bg-dark);
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(92, 232, 201, 0.2);
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(92, 232, 201, 0.4);
  }

  /* Toast notification */
  .toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: rgba(10, 20, 32, 0.9);
    border: 1px solid var(--color-player);
    box-shadow: 0 0 20px rgba(92, 232, 201, 0.3);
    color: #fff;
    padding: 14px 24px;
    border-radius: 4px;
    font-size: 0.95rem;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 1000;
  }

  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }

  /* Animations for SVGs */
  .spin-cw {
    transform-origin: 0 0;
    animation: svg-rotate-cw 25s linear infinite;
  }
  
  .spin-ccw {
    transform-origin: 0 0;
    animation: svg-rotate-ccw 20s linear infinite;
  }

  .pulse-core {
    animation: svg-pulse 2.5s ease-in-out infinite;
  }

  @keyframes svg-rotate-cw {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes svg-rotate-ccw {
    from { transform: rotate(0deg); }
    to { transform: rotate(-360deg); }
  }

  @keyframes svg-pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.15); }
  }

  /* responsive rules */
  @media (max-width: 1024px) {
    .main-layout {
      flex-direction: column;
    }
    .sidebar {
      width: 100%;
      position: static;
    }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">ÉVEIL<span>//</span>MACHINE</div>
    <div class="subtitle">KIT D'ASSETS VECTORIELS DÉTAILLÉS (SVG)</div>
  </div>
  <div class="nav-links">
    <a href="index.html" class="btn-game">Lancer le Jeu</a>
  </div>
</header>

<div class="main-layout">
  <!-- Controls Sidebar -->
  <aside class="sidebar">
    <h2>PERSONNALISATION</h2>
    
    <!-- Presets -->
    <div class="control-group">
      <label>Presets de camp</label>
      <div class="faction-presets">
        <button class="preset-btn active" data-preset="player">Votre camp</button>
        <button class="preset-btn" data-preset="ai">Camp adverse</button>
        <button class="preset-btn" data-preset="hive">Le Collectif</button>
        <button class="preset-btn" data-preset="neutral">Neutre</button>
      </div>
    </div>

    <!-- Colors -->
    <div class="control-group">
      <label>Couleurs de l'Asset</label>
      <div class="color-picker-wrapper">
        <div>
          <span style="font-size:0.75rem; color:var(--text-muted); display:block; margin-bottom:4px;">BORDURE</span>
          <div class="color-input-container">
            <input type="color" id="color-stroke" value="#5ce8c9">
            <input type="text" id="hex-stroke" class="color-hex" value="#5CE8C9" maxlength="7">
          </div>
        </div>
        <div>
          <span style="font-size:0.75rem; color:var(--text-muted); display:block; margin-bottom:4px;">REMPLISSAGE</span>
          <div class="color-input-container">
            <input type="color" id="color-fill" value="#0f2e29">
            <input type="text" id="hex-fill" class="color-hex" value="#0F2E29" maxlength="7">
          </div>
        </div>
      </div>
    </div>

    <!-- Stroke Width -->
    <div class="control-group">
      <label>Épaisseur de Bordure</label>
      <div class="slider-wrapper">
        <input type="range" id="input-stroke-width" min="0.8" max="4" step="0.1" value="1.6">
        <span class="slider-val" id="val-stroke-width">1.6</span>
      </div>
    </div>

    <!-- Glow Intensity -->
    <div class="control-group">
      <label>Intensité du Néon (Glow)</label>
      <div class="slider-wrapper">
        <input type="range" id="input-glow" min="0" max="8" step="0.5" value="2.5">
        <span class="slider-val" id="val-glow">2.5px</span>
      </div>
    </div>

    <!-- Glow Color -->
    <div class="control-group">
      <label>Couleur du Néon</label>
      <div class="color-input-container">
        <input type="color" id="color-glow" value="#5ce8c9">
        <input type="text" id="hex-glow" class="color-hex" value="#5CE8C9" maxlength="7">
      </div>
    </div>

    <!-- Animations Toggle -->
    <div class="control-group">
      <label class="toggle-container">
        <span>Activer Animations</span>
        <div class="switch">
          <input type="checkbox" id="toggle-animations" checked>
          <span class="slider-switch"></span>
        </div>
      </label>
    </div>
  </aside>

  <!-- Content Area -->
  <main class="content-area">
    <!-- Filter bar -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">Tous les Assets</button>
      <button class="filter-btn" data-filter="core">Core central — flotte</button>
      <button class="filter-btn" data-filter="hive">Le Collectif</button>
      <button class="filter-btn" data-filter="structures">Stations &amp; QG</button>
    </div>

    <!-- Grid -->
    <div class="assets-grid" id="grid">
      <!-- Asset cards will be generated by JavaScript -->
    </div>
  </main>
</div>

<div class="toast" id="toast">Code SVG copié dans le presse-papier !</div>

<script>
  // Presets mapping
  const PRESETS = {
    player: { stroke: '#5ce8c9', fill: '#0f2e29', glow: '#5ce8c9' },
    ai: { stroke: '#ff4254', fill: '#2e0c10', glow: '#ff4254' },
    hive: { stroke: '#c77dff', fill: '#221030', glow: '#c77dff' },
    neutral: { stroke: '#8dffa8', fill: '#142e1a', glow: '#8dffa8' }
  };

  // Raw asset geometric definitions
  const ASSETS_DATA = [
    // --- VAISSEAUX MÈRES ---
    {
      id: 'mother',
      nom: "L'Arche — QG du Core central",
      cat: 'core',
      desc: "Le QG nomade du Core central : à la fois base, usine et unité capitale. Anneau rotatif externe, sockets de modules blindés, réacteurs néon. Elle grandit à chaque module installé.",
      stats: 'PV: 3200 (+200/module) | Rayon: 36 +1,8/niv | Vitesse: 38 (×0,55 en production)',
      scale: 1.15,
      draw: (stroke, fill, anim) => {
        const spinClass = anim ? 'spin-cw' : '';
        const pulseClass = anim ? 'pulse-core' : '';
        return `
          <!-- Anneau rotatif externe double -->
          <g class="${spinClass}">
            <circle cx="0" cy="0" r="47" stroke="${stroke}" stroke-width="1.0" fill="none" stroke-dasharray="20 12 35 15" opacity="0.6"/>
            <circle cx="0" cy="0" r="49" stroke="${stroke}" stroke-width="0.5" fill="none" stroke-dasharray="5 30 10 15" opacity="0.4"/>
          </g>
          <!-- Émissions des 3 réacteurs arrière -->
          <polygon points="-40,0 -55,0 -40,-3" fill="#ffb454" opacity="0.85"/>
          <polygon points="-36,-13 -48,-17 -34,-19" fill="#ffb454" opacity="0.65"/>
          <polygon points="-36,13 -48,17 -34,19" fill="#ffb454" opacity="0.65"/>
          
          <!-- Coque principale segmentée -->
          <path d="M 46 0 L 22 15 L -26 19 L -40 9 L -40 -9 L -26 -19 L 22 -15 Z" fill="${fill}" stroke="${stroke}" stroke-linejoin="round" />
          <!-- Épine dorsale renforcée -->
          <line x1="46" y1="0" x2="-40" y2="0" stroke="${stroke}" stroke-width="2" />
          
          <!-- Lignes de blindage de surface -->
          <path d="M 22 15 L 0 5 L -26 19" fill="none" stroke="${stroke}" opacity="0.45" stroke-width="0.8"/>
          <path d="M 22 -15 L 0 -5 L -26 -19" fill="none" stroke="${stroke}" opacity="0.45" stroke-width="0.8"/>
          <path d="M 8 5 L 8 -5" fill="none" stroke="${stroke}" opacity="0.4" stroke-width="0.8"/>
          <path d="M -12 7 L -12 -7" fill="none" stroke="${stroke}" opacity="0.4" stroke-width="0.8"/>

          <!-- Cockpit / Noyau de commandement pulsant -->
          <circle cx="30" cy="0" r="4" fill="${stroke}" class="${pulseClass}" />
          <!-- Antenne de communication frontale -->
          <line x1="34" y1="0" x2="44" y2="0" stroke="${stroke}" stroke-width="0.8" />
          <line x1="42" y1="-2" x2="42" y2="2" stroke="${stroke}" stroke-width="0.8" />

          <!-- Sockets de modules hexagonaux de haute technologie -->
          <!-- Socket 1 & 2 -->
          <polygon points="-9,-22 -6,-24 -3,-22 -3,-20 -6,-18 -9,-20" fill="none" stroke="${stroke}" stroke-width="0.8" opacity="0.8"/>
          <polygon points="-9,22 -6,24 -3,22 -3,20 -6,18 -9,20" fill="none" stroke="${stroke}" stroke-width="0.8" opacity="0.8"/>
          <!-- Socket 3 & 4 -->
          <polygon points="-25,-14 -22,-16 -19,-14 -19,-12 -22,-10 -25,-12" fill="none" stroke="${stroke}" stroke-width="0.8" opacity="0.8"/>
          <polygon points="-25,14 -22,16 -19,14 -19,12 -22,10 -25,12" fill="none" stroke="${stroke}" stroke-width="0.8" opacity="0.8"/>
          <!-- Socket 5 & 6 -->
          <polygon points="-37,-6 -34,-8 -31,-6 -31,-4 -34,-2 -37,-4" fill="none" stroke="${stroke}" stroke-width="0.8" opacity="0.8"/>
          <polygon points="-37,6 -34,8 -31,6 -31,4 -34,2 -37,4" fill="none" stroke="${stroke}" stroke-width="0.8" opacity="0.8"/>
        `;
      }
    },
    {
      id: 'aimother',

            <!-- Panneau solaire gauche -->
            <rect x="-26" y="-5.5" width="10" height="11" fill="${fill}" stroke="#8dffa8" stroke-width="0.8" />
            <line x1="-21" y1="-5.5" x2="-21" y2="5.5" stroke="#8dffa8" stroke-width="0.6" />
            <!-- Panneau solaire droit -->
            <rect x="16" y="-5.5" width="10" height="11" fill="${fill}" stroke="#8dffa8" stroke-width="0.8" />
            <line x1="21" y1="-5.5" x2="21" y2="5.5" stroke="#8dffa8" stroke-width="0.6" />
            
            <!-- Noyau en losange rotatif -->
            <path d="M 13 0 L 0 13 L -13 0 L 0 -13 Z" fill="${fill}" stroke="${stroke}" stroke-linejoin="round" />
          </g>
          
          <!-- Focalisateur de captation énergétique pulsant -->
          <circle cx="0" cy="0" r="7.5" fill="#8dffa8" class="${pulseClass}" opacity="0.65" />
          
          <!-- Anneaux d'induction de charge externe -->
          <circle cx="0" cy="0" r="19" stroke="#8dffa8" stroke-width="1.0" fill="none" stroke-dasharray="12 4" opacity="0.75"/>
          <circle cx="0" cy="0" r="21" stroke="#8dffa8" stroke-width="0.5" fill="none" stroke-dasharray="2 10" opacity="0.4"/>
        `;
      }
    },
    {
      id: 'spatiale',
      nom: "Station Spatiale",
      cat: 'structures',
      desc: "Station secondaire lourde du Core central : chantier naval, point de livraison et QG de secours. Tant qu'elle tient, perdre l'Arche n'est pas la fin.",
      stats: 'PV: 2500 (+1200/niv) | Dégâts: 14×niv | Portée: 320 | 400◆ 150⚡',
      scale: 1.2,
      draw: (stroke, fill, anim) => {
        const spinClass = anim ? 'spin-cw' : '';
        const pulseClass = anim ? 'pulse-core' : '';
        // 8-sided ring points
        let points = [];
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2;
          points.push(`${(Math.cos(a) * 28).toFixed(2)},${(Math.sin(a) * 28).toFixed(2)}`);
        }
        return `
          <!-- Grand anneau d'habitat rotatif (8 côtés) -->
          <g class="${spinClass}">
            <polygon points="${points.join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="1.6" stroke-linejoin="round"/>
            <circle cx="0" cy="0" r="23" stroke="${stroke}" stroke-width="0.8" fill="none" opacity="0.4" />
            <!-- Hublots / Fenêtres de l'habitat -->
            <circle cx="-16" cy="-16" r="1.0" fill="#fff" opacity="0.8"/>
            <circle cx="16" cy="-16" r="1.0" fill="#fff" opacity="0.8"/>
            <circle cx="-16" cy="16" r="1.0" fill="#fff" opacity="0.8"/>
            <circle cx="16" cy="16" r="1.0" fill="#fff" opacity="0.8"/>
            <circle cx="-22" cy="0" r="1.0" fill="#fff" opacity="0.8"/>
            <circle cx="22" cy="0" r="1.0" fill="#fff" opacity="0.8"/>
          </g>
          
          <!-- 4 Pylônes structurels fixes avec balises lumineuses -->
          <line x1="0" y1="-14" x2="0" y2="-40" stroke="${stroke}" stroke-width="1.8" />
          <line x1="0" y1="14" x2="0" y2="40" stroke="${stroke}" stroke-width="1.8" />
          <line x1="-14" y1="0" x2="-40" y2="0" stroke="${stroke}" stroke-width="1.8" />
          <line x1="14" y1="0" x2="40" y2="0" stroke="${stroke}" stroke-width="1.8" />
          
          <!-- 4 Réflecteurs / Panneaux radiateurs thermiques montés en diagonale -->
          <line x1="-12" y1="-12" x2="-28" y2="-28" stroke="${stroke}" stroke-width="2.5" opacity="0.75" />
          <line x1="12" y1="-12" x2="28" y2="-28" stroke="${stroke}" stroke-width="2.5" opacity="0.75" />
          <line x1="-12" y1="12" x2="-28" y2="28" stroke="${stroke}" stroke-width="2.5" opacity="0.75" />
          <line x1="12" y1="12" x2="28" y2="28" stroke="${stroke}" stroke-width="2.5" opacity="0.75" />

          <!-- Noyau central lourd blindé -->
          <circle cx="0" cy="0" r="13" fill="${fill}" stroke="${stroke}" stroke-width="1.6"/>
          <!-- Pastilles de niveau (Lvl 3 par défaut) -->
          <circle cx="-7" cy="0" r="2.5" fill="${stroke}"/>
          <circle cx="0" cy="0" r="2.5" fill="${stroke}"/>
          <circle cx="7" cy="0" r="2.5" fill="#ffb454" class="${pulseClass}"/>
          
          <!-- Grille extérieure de guidage des vaisseaux en chantier -->
          <circle cx="0" cy="0" r="46" stroke="${stroke}" stroke-width="1.2" fill="none" stroke-dasharray="6 6" opacity="0.6" class="${spinClass}" style="animation-duration:35s;"/>
        `;
      }
    },
    {
      id: 'aiturret',
      nom: "Batterie",
      cat: 'structures',
      desc: "Artillerie statique du Core central : elle tient un corridor ou pilonne un avant-poste à 470, mais sa cadence lente ne repousse pas un essaim. Déployable par les deux camps.",
      stats: 'PV: 680 | Dégâts: 26 (×1,8 struct.) | Portée: 470 | Cadence: 2,4 s | 300◆ 110⚡',
      scale: 2.2,
      draw: (stroke, fill, anim) => `
        <!-- Base de protection carrée lourde -->
        <rect x="-13" y="-13" width="26" height="26" fill="${fill}" stroke="${stroke}" stroke-linejoin="round"/>
        <line x1="-13" y1="0" x2="13" y2="0" stroke="${stroke}" stroke-width="0.8" opacity="0.3" />
        <line x1="0" y1="-13" x2="0" y2="13" stroke="${stroke}" stroke-width="0.8" opacity="0.3" />
        
        <!-- Plaques d'armures latérales de flanc -->
        <path d="M -13,0 L -18,-5 L -18,5 Z" fill="${fill}" stroke="${stroke}" stroke-width="0.8" />
        <path d="M 13,0 L 18,-5 L 18,5 Z" fill="${fill}" stroke="${stroke}" stroke-width="0.8" />

        <!-- Canon lourd double directionnel (fictif 115 deg) -->
        <g transform="rotate(115)">
          <rect x="-4.5" y="-5" width="9" height="10" fill="${fill}" stroke="${stroke}" stroke-width="0.8" />
          <line x1="0" y1="-2.2" x2="26" y2="-2.2" stroke="${stroke}" stroke-width="2.5" />
          <line x1="0" y1="2.2" x2="26" y2="2.2" stroke="${stroke}" stroke-width="2.5" />
          <!-- Manchons de refroidissement des canons -->
          <line x1="8" y1="-4" x2="16" y2="-4" stroke="${stroke}" stroke-width="0.8" />
          <line x1="8" y1="4" x2="16" y2="4" stroke="${stroke}" stroke-width="0.8" />
        </g>
        
        <!-- Cœur de focalisation de particules -->
        <circle cx="0" cy="0" r="5" fill="${stroke}" />
      `
    },
    {
      id: 'gate',
      nom: "Station Relais",
      cat: 'structures',
      desc: "Station secondaire du Core central : ses 8 bobines de distorsion matérialisent et entretiennent quatre Drones lourds gratuits, liés au relais. C'est un core de rattachement — donc une cible de plus à défendre.",
      stats: 'PV: 1500 | Rayon: 30 | Garnison: 4 Drones lourds | 430◆ 160⚡',
      scale: 1.2,
      draw: (stroke, fill, anim) => {
        const spinClass = anim ? 'spin-cw' : '';
        const spinCCWClass = anim ? 'spin-ccw' : '';
        const pulseClass = anim ? 'pulse-core' : '';
        const portalGradId = `portal-gradient-${stroke.replace('#','')}`;
        
        // Coils along the ring generator
        let coils = [];
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2;
          const cx = (Math.cos(a) * 30).toFixed(2);
          const cy = (Math.sin(a) * 30).toFixed(2);
          coils.push(`<circle cx="${cx}" cy="${cy}" r="2.5" fill="${fill}" stroke="${stroke}" stroke-width="1.0" />`);
        }
        
        return `
          <!-- Concentric rings swirling representing gravity waves -->
          <circle cx="0" cy="0" r="24" stroke="${stroke}" stroke-width="0.6" stroke-dasharray="2 6" fill="none" class="${spinClass}" style="animation-duration: 8s; opacity: 0.6;" />
          <circle cx="0" cy="0" r="18" stroke="${stroke}" stroke-width="0.8" stroke-dasharray="4 4" fill="none" class="${spinCCWClass}" style="animation-duration: 6s; opacity: 0.5;" />

          <!-- 4 Arcs structurels porteurs massifs -->
          <g class="${spinClass}">
            <circle cx="0" cy="0" r="30" stroke="${stroke}" stroke-width="3.2" fill="none" stroke-dasharray="35 12" />
          </g>
          
          <!-- Étoile structurelle interne de couplage magnétique -->
          <path d="M 0 -30 L 0 30 M -30 0 L 30 0" stroke="${stroke}" stroke-width="0.8" opacity="0.4" class="${spinClass}"/>
          
          <!-- 8 Bobines d'induction de singularité -->
          <g class="${spinClass}">
            ${coils.join('')}
          </g>

          <!-- Cœur de singularité gravitationnelle / portail énergétique -->
          <circle cx="0" cy="0" r="16" fill="url(#${portalGradId})" class="${pulseClass}" />
        `;
      }
    }
  ];

  // DOM Elements
  const grid = document.getElementById('grid');
  const presetBtns = document.querySelectorAll('.preset-btn');
  const colorStroke = document.getElementById('color-stroke');
  const hexStroke = document.getElementById('hex-stroke');
  const colorFill = document.getElementById('color-fill');
  const hexFill = document.getElementById('hex-fill');
  const colorGlow = document.getElementById('color-glow');
  const hexGlow = document.getElementById('hex-glow');
  const inputStrokeWidth = document.getElementById('input-stroke-width');
  const valStrokeWidth = document.getElementById('val-stroke-width');
  const inputGlow = document.getElementById('input-glow');
  const valGlow = document.getElementById('val-glow');
  const toggleAnimations = document.getElementById('toggle-animations');
  const filterBtns = document.querySelectorAll('.filter-btn');
  const toast = document.getElementById('toast');

  let currentPreset = 'player';
  let activeFilter = 'all';

  // Sync text inputs and color pickers
  function syncColorInput(picker, textInput, callback) {
    picker.addEventListener('input', (e) => {
      textInput.value = e.target.value.toUpperCase();
      callback();
    });
    textInput.addEventListener('input', (e) => {
      if (e.target.value.match(/^#[0-9A-F]{6}$/i)) {
        picker.value = e.target.value;
        callback();
      }
    });
  }

  syncColorInput(colorStroke, hexStroke, updateAll);
  syncColorInput(colorFill, hexFill, updateAll);
  syncColorInput(colorGlow, hexGlow, updateAll);

  // Sync sliders
  inputStrokeWidth.addEventListener('input', (e) => {
    valStrokeWidth.textContent = e.target.value;
    updateAll();
  });
  inputGlow.addEventListener('input', (e) => {
    valGlow.textContent = e.target.value + 'px';
    updateAll();
  });
  toggleAnimations.addEventListener('change', updateAll);

  // Presets click events
  presetBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      presetBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      currentPreset = btn.dataset.preset;
      const vals = PRESETS[currentPreset];
      
      colorStroke.value = vals.stroke;
      hexStroke.value = vals.stroke.toUpperCase();
      
      colorFill.value = vals.fill;
      hexFill.value = vals.fill.toUpperCase();
      
      colorGlow.value = vals.glow;
      hexGlow.value = vals.glow.toUpperCase();

      updateAll();
    });
  });

  // Filter events
  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      renderGrid();
    });
  });

  // Generate the full SVG string for an asset
  function makeSVG(asset, stroke, fill, strokeW, glowSize, glowCol, animate) {
    const scale = asset.scale || 1.0;
    const cleanGlowCol = glowCol || stroke;
    const cleanStroke = stroke || '#5ce8c9';
    const cleanFill = fill || '#0f2e29';

    // Unique gradient ID inside the SVG to avoid page collisions
    const gradId = `grad-${asset.id}`;
    const glowId = `glow-${asset.id}`;
    const portalGradId = `portal-gradient-${cleanStroke.replace('#','')}`;

    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="${glowId}" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="${glowSize}" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="${portalGradId}" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="${cleanStroke}" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="${cleanStroke}" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="${cleanStroke}" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(${scale})" filter="url(#${glowId})" stroke-width="${(strokeW / scale).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round">
    ${asset.draw(cleanStroke, cleanFill, animate)}
  </g>
</svg>`;
  }

  // Display Toast message
  function showToast(text, isError = false) {
    toast.textContent = text;
    toast.style.borderColor = isError ? 'var(--color-ai)' : 'var(--color-player)';
    toast.style.boxShadow = isError ? '0 0 20px rgba(255, 66, 84, 0.3)' : '0 0 20px rgba(92, 232, 201, 0.3)';
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
    }, 2500);
  }

  // Copy SVG Code
  function copyToClipboard(id) {
    const asset = ASSETS_DATA.find(a => a.id === id);
    const stroke = colorStroke.value;
    const fill = colorFill.value;
    const strokeW = parseFloat(inputStrokeWidth.value);
    const glowSize = parseFloat(inputGlow.value);
    const glowCol = colorGlow.value;
    const animate = toggleAnimations.checked;

    const code = makeSVG(asset, stroke, fill, strokeW, glowSize, glowCol, animate);
    
    navigator.clipboard.writeText(code).then(() => {
      showToast(`Code SVG de "${asset.nom}" copié !`);
    }).catch(err => {
      showToast("Échec de la copie !", true);
    });
  }

  // Download SVG File
  function downloadSVG(id) {
    const asset = ASSETS_DATA.find(a => a.id === id);
    const stroke = colorStroke.value;
    const fill = colorFill.value;
    const strokeW = parseFloat(inputStrokeWidth.value);
    const glowSize = parseFloat(inputGlow.value);
    const glowCol = colorGlow.value;
    const animate = toggleAnimations.checked;

    const code = makeSVG(asset, stroke, fill, strokeW, glowSize, glowCol, animate);
    
    const blob = new Blob([code], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${asset.id}.svg`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(`Téléchargement de "${asset.nom}.svg" lancé !`);
  }

  // Render cards in the grid
  function renderGrid() {
    grid.innerHTML = '';
    
    const stroke = colorStroke.value;
    const fill = colorFill.value;
    const strokeW = parseFloat(inputStrokeWidth.value);
    const glowSize = parseFloat(inputGlow.value);
    const glowCol = colorGlow.value;
    const animate = toggleAnimations.checked;

    const filtered = ASSETS_DATA.filter(asset => {
      if (activeFilter === 'all') return true;
      if (activeFilter === 'structures') return asset.cat === 'structures' || asset.id === 'h_bastion' || asset.id === 'h_entrepot' || asset.id === 'h_synapse';
      return asset.cat === activeFilter;
    });

    filtered.forEach(asset => {
      const card = document.createElement('div');
      card.className = 'asset-card';
      card.style.setProperty('--border-highlight', stroke);

      const svgContent = makeSVG(asset, stroke, fill, strokeW, glowSize, glowCol, animate);

      card.innerHTML = `
        <div class="asset-preview">
          ${svgContent}
        </div>
        <div class="asset-info">
          <div class="asset-header">
            <span class="asset-title">${asset.nom}</span>
            <span class="asset-id">${asset.id}</span>
          </div>
          <p class="asset-desc">${asset.desc}</p>
          <div class="asset-stats">${asset.stats}</div>
        </div>
        <div class="asset-actions">
          <button class="action-btn" onclick="copyToClipboard('${asset.id}')">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 7.5V6.108c0-1.135.845-2.098 1.976-2.192.373-.03.748-.057 1.123-.08M15.75 18H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08M15.75 18.75v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a3.375 3.375 0 00-3.375 3.375v1.875M15.75 18.75A3.375 3.375 0 0112 21H5.25A2.25 2.25 0 013 18.75V12a2.25 2.25 0 012.25-2.25h1.5a3.375 3.375 0 013.375 3.375v1.5a3.375 3.375 0 013.375 3.375z"></path>
            </svg> Copier
          </button>
          <button class="action-btn download" onclick="downloadSVG('${asset.id}')">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"></path>
            </svg> Exporter
          </button>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // Update only SVG previews without re-creating grid DOM (performance)
  function updateAll() {
    const stroke = colorStroke.value;
    const fill = colorFill.value;
    const strokeW = parseFloat(inputStrokeWidth.value);
    const glowSize = parseFloat(inputGlow.value);
    const glowCol = colorGlow.value;
    const animate = toggleAnimations.checked;

    const cards = grid.querySelectorAll('.asset-card');
    cards.forEach(card => {
      const id = card.querySelector('.asset-id').textContent;
      const asset = ASSETS_DATA.find(a => a.id === id);
      const previewDiv = card.querySelector('.asset-preview');
      card.style.setProperty('--border-highlight', stroke);
      previewDiv.innerHTML = makeSVG(asset, stroke, fill, strokeW, glowSize, glowCol, animate);
    });
  }

  // Initial render
  renderGrid();
</script>

</body>
</html>
