<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Styles CSS animés embarqués pour autonomie de l'image -->
    <style>
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .spin-cw {
        transform-origin: 0px 0px;
        animation: spin-cw 25s linear infinite;
      }
      .spin-ccw {
        transform-origin: 0px 0px;
        animation: spin-ccw 20s linear infinite;
      }
      .pulse-core {
        transform-origin: 0px 0px;
        animation: pulse 2.5s ease-in-out infinite;
      }
    </style>

    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="glow-h_entrepot" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="portal-gradient-c77dff" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c77dff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#c77dff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c77dff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(3.2)" filter="url(#glow-h_entrepot)" stroke-width="0.50" stroke-linecap="round" stroke-linejoin="round">
    
        <!-- Anneau d'amarrage externe -->
        <polygon points="12.93,5.36 5.36,12.93 -5.36,12.93 -12.93,5.36 -12.93,-5.36 -5.36,-12.93 5.36,-12.93 12.93,-5.36" fill="none" stroke="#c77dff" stroke-width="0.8" stroke-dasharray="3 3" />
        <!-- Coque principale de l'entrepôt -->
        <polygon points="9.24,3.83 3.83,9.24 -3.83,9.24 -9.24,3.83 -9.24,-3.83 -3.83,-9.24 3.83,-9.24 9.24,-3.83" fill="#221030" stroke="#c77dff" stroke-width="1.5" stroke-linejoin="round" />
        
        <!-- Sas d'accès et voies logistiques -->
        <line x1="-14" y1="0" x2="14" y2="0" stroke="#c77dff" stroke-width="1" opacity="0.6" />
        <line x1="0" y1="-14" x2="0" y2="14" stroke="#c77dff" stroke-width="1" opacity="0.6" />
        
        <!-- Modules de stockage géants -->
        <rect x="-6" y="-6" width="5" height="5" fill="rgba(255, 180, 84, 0.4)" stroke="#c77dff" stroke-width="1" />
        <rect x="1" y="-6" width="5" height="5" fill="rgba(141, 255, 168, 0.4)" stroke="#c77dff" stroke-width="1" />
        <rect x="-6" y="1" width="5" height="5" fill="rgba(199, 125, 255, 0.4)" stroke="#c77dff" stroke-width="1" />
        <rect x="1" y="1" width="5" height="5" fill="rgba(255, 180, 84, 0.4)" stroke="#c77dff" stroke-width="1" />
        
        <!-- Processeur d'inventaire central -->
        <circle cx="0" cy="0" r="2.5" fill="#8dffa8" class="pulse-core" opacity="0.9"/>
      
  </g>
</svg>