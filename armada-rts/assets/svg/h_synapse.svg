<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Styles CSS animés embarqués pour autonomie de l'image -->
    <style>
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .spin-cw {
        transform-origin: 0px 0px;
        animation: spin-cw 25s linear infinite;
      }
      .spin-ccw {
        transform-origin: 0px 0px;
        animation: spin-ccw 20s linear infinite;
      }
      .pulse-core {
        transform-origin: 0px 0px;
        animation: pulse 2.5s ease-in-out infinite;
      }
    </style>

    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="glow-h_synapse" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="portal-gradient-c77dff" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c77dff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#c77dff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c77dff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(4.5)" filter="url(#glow-h_synapse)" stroke-width="0.36" stroke-linecap="round" stroke-linejoin="round">
    
        <!-- Mât émetteur et antennes cybernétiques -->
        <line x1="0" y1="7" x2="0" y2="13.5" stroke="#c77dff" stroke-width="1.2" />
        <line x1="0" y1="13.5" x2="-3.5" y2="13.5" stroke="#c77dff" stroke-width="0.8" />
        <line x1="0" y1="-7" x2="0" y2="-13.5" stroke="#c77dff" stroke-width="1.2" />
        <line x1="0" y1="-13.5" x2="3.5" y2="-13.5" stroke="#c77dff" stroke-width="0.8" />
        <line x1="-9" y1="0" x2="-15.5" y2="0" stroke="#c77dff" stroke-width="1.2" />
        <circle cx="-15.5" cy="0" r="1.5" fill="#c77dff" />
        
        <!-- Coque losangique protectrice -->
        <path d="M 9 0 L 0 7 L -9 0 L 0 -7 Z" fill="#221030" stroke="#c77dff" stroke-linejoin="round" />
        <!-- Récepteur de signal radar focalisé -->
        <circle cx="0" cy="0" r="6.5" fill="none" stroke="#c77dff" stroke-width="0.6" opacity="0.5" />
        <!-- Processeur optique central (carré) -->
        <rect x="-3.5" y="-3.5" width="7" height="7" fill="#221030" stroke="#c77dff" stroke-width="1.0" />
        <circle cx="0" cy="0" r="2.0" fill="#c77dff" class="pulse-core" />
      
  </g>
</svg>