<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Styles CSS animés embarqués pour autonomie de l'image -->
    <style>
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .spin-cw {
        transform-origin: 0px 0px;
        animation: spin-cw 25s linear infinite;
      }
      .spin-ccw {
        transform-origin: 0px 0px;
        animation: spin-ccw 20s linear infinite;
      }
      .pulse-core {
        transform-origin: 0px 0px;
        animation: pulse 2.5s ease-in-out infinite;
      }
    </style>

    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="glow-cminer" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="portal-gradient-5ce8c9" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ce8c9" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#5ce8c9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5ce8c9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(7.2)" filter="url(#glow-cminer)" stroke-width="0.22" stroke-linecap="round" stroke-linejoin="round">
    
      <!-- Petit châssis utilitaire blindé -->
      <path d="M 2 1.5 L -2 2.5 L -3 0 L -2 -2.5 L 2 -1.5 Z" fill="#0f2e29" stroke="#5ce8c9" stroke-linejoin="round" />
      <!-- Bras de préhension magnétiques -->
      <path d="M 2 1.5 L 4 3 L 5 3" fill="none" stroke="#5ce8c9" stroke-width="0.6" />
      <path d="M 2 -1.5 L 4 -3 L 5 -3" fill="none" stroke="#5ce8c9" stroke-width="0.6" />
      <!-- Lumière de travail -->
      <circle cx="2" cy="0" r="0.6" fill="#5ce8c9" opacity="0.9" />
      <!-- Propulseur omnidirectionnel arrière -->
      <polygon points="-3,0.5 -5,0 -3,-0.5" fill="#ffb454" opacity="0.8" />
    
  </g>
</svg>