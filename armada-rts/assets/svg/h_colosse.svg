<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <defs>
    <!-- Filtre de lueur néon haute-qualité -->
    <filter id="glow-h_colosse" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient d'intensité pour le Portail de Distorsion -->
    <radialGradient id="portal-gradient-c77dff" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c77dff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#c77dff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c77dff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Conteneur global appliquant la mise à l'échelle et la lueur -->
  <g transform="scale(2.6)" filter="url(#glow-h_colosse)" stroke-width="0.62" stroke-linecap="round" stroke-linejoin="round">
    
          <!-- Tuyères de poussée arrière -->
          <polygon points="-13,5 -19,3 -13,1" fill="#c77dff" opacity="0.85" />
          <polygon points="-13,-5 -19,-3 -13,-1" fill="#c77dff" opacity="0.85" />
          <!-- Coque massive à mâchoires -->
          <path d="M 15 0 L 6 9 L -8 12 L -13 5 L -8 0 L -13 -5 L -8 -12 L 6 -9 Z" fill="#221030" stroke="#c77dff" stroke-width="1.5" stroke-linejoin="round" />
          <!-- Plaques de blindage héritées des Bastions -->
          <path d="M 4 7 L -6 9 L -9 5" fill="none" stroke="#c77dff" stroke-width="0.8" opacity="0.75" />
          <path d="M 4 -7 L -6 -9 L -9 -5" fill="none" stroke="#c77dff" stroke-width="0.8" opacity="0.75" />
          <!-- Mâchoires frontales -->
          <line x1="15" y1="0" x2="7" y2="4" stroke="#c77dff" stroke-width="1.3" />
          <line x1="15" y1="0" x2="7" y2="-4" stroke="#c77dff" stroke-width="1.3" />
          <!-- Double cœur : les deux Bastions restent lisibles -->
          <circle cx="-2" cy="3.5" r="2" fill="#221030" stroke="#c77dff" stroke-width="0.9" />
          <circle cx="-2" cy="-3.5" r="2" fill="#221030" stroke="#c77dff" stroke-width="0.9" />
          <circle cx="3" cy="0" r="2.4" fill="#c77dff" class="pulse-core" />
        
  </g>
</svg>